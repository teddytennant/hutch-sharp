[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hutch-sharp"
version = "0.1.0"
description = "Hutch#, the non-adaptive Frobenius norm estimator of arXiv 2609.28472"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "numpy",
    "pytest",
]

[project.scripts]
hutch-sharp-demo = "hutch_sharp.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
